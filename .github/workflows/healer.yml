name: Healer

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "Build passed, nothing to heal"

  on-failure:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - run: echo "conclusion=${{ github.event.workflow_run.conclusion }}"
      - run: echo "head_sha=${{ github.event.workflow_run.head_sha }}"
      - run: echo "head_branch=${{ github.event.workflow_run.head_branch }}"
      - run: echo "run_id=${{ github.event.workflow_run.id }}"
      - uses: actions/download-artifact@v4
        with:
          name: test
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: ls -R target/surefire-reports build.log
        continue-on-error: true
      - run: grep -e 'Failed to execute goal' -e '<failure' -e '<error' build.log target/surefire-reports/*.xml
        continue-on-error: true
